fitflow.demo.seed-enabled=${DEMO_SEED_ENABLED:true}

# ── Email (SMTP) ───────────────────────────────────────────────────────────────
# Supports both SMTP_* and standard MAIL_* environment variable aliases.
# Example for Gmail SMTP (requires an App Password, not normal Gmail password):
#   MAIL_HOST=smtp.gmail.com
#   MAIL_PORT=587
#   MAIL_USERNAME=appu12813@gmail.com
#   MAIL_PASSWORD=your-16-char-app-password
#   MAIL_FROM=FitFlow
spring.mail.host=${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SMTP_USERNAME:appu12813@gmail.com}}
spring.mail.password=${MAIL_PASSWORD:${SMTP_PASSWORD:Lulu@3002}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# FitFlow-specific email settings
fitflow.mail.from-name=${MAIL_FROM:${SMTP_FROM_NAME:FitFlow}}
fitflow.mail.from-email=${MAIL_USERNAME:${SMTP_USERNAME:appu12813@gmail.com}}
fitflow.mail.enabled=${SMTP_ENABLED:true}

# Deadline Notification Recipients (Configurable Gmail recipient list)
fitflow.mail.deadline-notification-emails=${DEADLINE_NOTIFICATION_EMAILS:appu12813@gmail.com,yadavdarshan922@gmail.com,darshankm703@gmail.com,lakalkakaakaaa@gmail.com}
fitflow.subscription.reminder-days=${SUBSCRIPTION_REMINDER_DAYS:7}

# ── Optional SMS Provider Configuration (e.g. Twilio) ───────────────────────────
# SMS is separate from email. Gmail cannot send SMS to email addresses.
fitflow.sms.enabled=${SMS_ENABLED:false}
fitflow.sms.provider=${SMS_PROVIDER:TWILIO}
fitflow.sms.account-sid=${TWILIO_ACCOUNT_SID:}
fitflow.sms.auth-token=${TWILIO_AUTH_TOKEN:}
fitflow.sms.from-number=${TWILIO_PHONE_NUMBER:}

# ── Scheduling ─────────────────────────────────────────────────────────────────
# Subscription expiry scheduler runs daily jobs at 08:00, 08:05, 08:10 server time
spring.task.scheduling.pool.size=2

# ── Logging ────────────────────────────────────────────────────────────────────
# Prevent credentials from appearing in logs
logging.level.org.springframework.mail=WARN
logging.level.com.fitflow=INFO
