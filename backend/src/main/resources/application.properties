# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/fitflow}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:your_secure_256_bit_jwt_secret_key_placeholder_for_development}
jwt.expirationMs=86400000

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ── CORS ───────────────────────────────────────────────────────────────────────
fitflow.cors.allowed-origins=${FRONTEND_URL:}

# ── Admin & Demo Seeding ──────────────────────────────────────────────────────
# Controls whether initial admin and demo test accounts are created on boot
fitflow.admin.seed-enabled=${ADMIN_SEED_ENABLED:true}
fitflow.admin.email=${ADMIN_EMAIL:admin@fitflow.com}
fitflow.admin.password=${ADMIN_INITIAL_PASSWORD:admin123}
fitflow.demo.seed-enabled=${DEMO_SEED_ENABLED:true}

# ── Email (SMTP) ───────────────────────────────────────────────────────────────
# Supports both SMTP_* and standard MAIL_* environment variable aliases.
# Example for Gmail SMTP (requires an App Password, not normal Gmail password):
#   MAIL_HOST=smtp.gmail.com
#   MAIL_PORT=587
#   MAIL_USERNAME=your_email@gmail.com
#   MAIL_PASSWORD=your_16_char_app_password
#   MAIL_FROM=FitFlow
spring.mail.host=${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
spring.mail.port=${MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SMTP_USERNAME:your_email@gmail.com}}
spring.mail.password=${MAIL_PASSWORD:${SMTP_PASSWORD:your_app_password}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# FitFlow-specific email settings
fitflow.mail.from-name=${MAIL_FROM:${SMTP_FROM_NAME:FitFlow}}
fitflow.mail.from-email=${MAIL_USERNAME:${SMTP_USERNAME:admin@fitflow.com}}
fitflow.mail.enabled=${SMTP_ENABLED:true}

# Deadline Notification Recipients (Configurable recipient list)
fitflow.mail.deadline-notification-emails=${DEADLINE_NOTIFICATION_EMAILS:admin@fitflow.com}
fitflow.subscription.reminder-days=${SUBSCRIPTION_REMINDER_DAYS:7}

# ── Optional SMS Provider Configuration (e.g. Twilio) ───────────────────────────
# SMS is separate from email. Gmail cannot send SMS to email addresses.
fitflow.sms.enabled=${SMS_ENABLED:false}
fitflow.sms.provider=${SMS_PROVIDER:TWILIO}
fitflow.sms.account-sid=${TWILIO_ACCOUNT_SID:}
fitflow.sms.auth-token=${TWILIO_AUTH_TOKEN:}
fitflow.sms.from-number=${TWILIO_PHONE_NUMBER:}

# ── Scheduling ─────────────────────────────────────────────────────────────────
# Subscription expiry scheduler runs daily jobs at 08:00, 08:05, 08:10 server time
spring.task.scheduling.pool.size=2

# ── Logging ────────────────────────────────────────────────────────────────────
# Prevent credentials from appearing in logs
logging.level.org.springframework.mail=WARN
logging.level.com.fitflow=INFO
